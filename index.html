<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All Stars</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--page:#a10824;--onpage:#fff;--surface:#fff;--ink:#101a2e;--muted:#566178;--line:#c9d1e0;--blue:#0b2242;--blue-ink:#fff;--red:#e52233;--focus:#0b57d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#a10824;--bg:#0b1220;--surface:#131d33;--ink:#e9eefb;--muted:#9fb0cf;--line:#2a3a5c;--blue:#8fb0ee;--blue-ink:#0b1220;--red:#ff5a66;--focus:#8ab4ff}}
:root[data-theme="dark"]{--page:#a10824;--bg:#0b1220;--surface:#131d33;--ink:#e9eefb;--muted:#9fb0cf;--line:#2a3a5c;--blue:#8fb0ee;--blue-ink:#0b1220;--red:#ff5a66;--focus:#8ab4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:18px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:4px solid var(--onpage);margin-bottom:22px}
h1{font:700 clamp(2.2rem,8vw,4rem)/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.14em;margin:0;text-align:center;color:var(--onpage)}
.logo{width:clamp(64px,14vw,96px);flex:none}
.titles{text-align:center}
.subhead{margin:8px 0 0;font:600 clamp(1.3rem,4.5vw,2rem)/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.3em;color:var(--onpage)}
.logo{height:auto;display:block}
.top{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:stretch}
.topics{display:flex;flex-direction:column;gap:10px}
.btnlist{display:flex;flex-direction:column;gap:12px}
.topics h2{font:600 1rem/1.2 "Barlow",sans-serif;color:var(--onpage);margin:0 0 2px}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--onpage);outline-offset:2px}
dialog button:focus-visible{outline-color:var(--focus)}
.tbtn{background:var(--surface);color:var(--blue);border:3px solid var(--blue);border-radius:10px;box-shadow:0 0 0 3px #fff;padding:12px 18px;text-align:left;width:100%;font:600 1.15rem "Barlow Condensed",sans-serif;letter-spacing:.04em}
.tbtn:hover{background:var(--blue);color:var(--blue-ink)}
a.tbtn{display:block;text-decoration:none}
.game{border:6px solid #e52233;box-shadow:0 0 0 4px #fff;border-radius:18px;background:var(--surface);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:10px}
.game{position:relative;overflow:hidden}
.gcard{position:relative;z-index:1;background:#0b2242;border-radius:28px;padding:22px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.game h2{font:700 clamp(1.8rem,5vw,2.6rem)/1.1 "Barlow Condensed",sans-serif;margin:0;color:#fff}
.game p{margin:0;color:#fff;max-width:30ch}
.gbtn{margin-top:8px;border:2px solid var(--red);background:var(--red);color:#fff;font-weight:600;border-radius:10px;padding:12px 26px;text-decoration:none;cursor:pointer}
section.topic{margin-top:44px}
.thead{display:inline-block;border:3px solid var(--blue);border-radius:12px;box-shadow:0 0 0 3px #fff;padding:6px 26px;font:700 clamp(1.6rem,5vw,2.2rem) "Barlow Condensed",sans-serif;color:var(--blue);background:var(--surface)}
.terms{list-style:none;padding:0;margin:16px 0 8px;display:grid;gap:10px;max-width:560px}
.terms li{padding:8px 14px;border:2px solid var(--blue);border-left:6px solid var(--red);border-radius:6px;background:var(--surface)}
.fcbtn{background:none;border:0;color:var(--onpage);text-decoration:underline;padding:4px 0;font-weight:600}
.other{margin-top:52px;text-align:center;font:600 clamp(1.4rem,4vw,1.9rem) "Barlow Condensed",sans-serif;color:var(--onpage)}
dialog{border:3px solid var(--blue);box-shadow:0 0 0 4px #fff;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(5,10,25,.65)}
.dbody{padding:20px}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dtop h3{margin:0;font:700 1.6rem "Barlow Condensed",sans-serif;color:var(--blue)}
.card{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:220px;margin:16px 0 8px;padding:24px;border:3px solid var(--blue);border-radius:14px;background:var(--bg);color:var(--ink);font:600 1.5rem "Barlow",sans-serif}
.card.back{border-color:var(--red);font-weight:400;font-size:1.25rem}
.meta{color:var(--muted);font-size:.95rem;text-align:center;margin:0 0 12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid var(--blue);background:var(--blue);color:var(--blue-ink);border-radius:8px;padding:8px 18px;font-weight:600}
.btn.ghost{background:none;color:var(--blue)}
.back{display:inline-block;margin-bottom:18px;color:var(--onpage);font-weight:600}
.gframe{background:#0b2242;border-radius:44px;box-shadow:0 0 0 4px #fff;padding:clamp(14px,3vw,30px)}
.gcourt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:540px;padding:30px 12px}
.cbg{position:absolute;inset:0;overflow:hidden;border-radius:4px}
.cbg svg{width:100%;height:100%;display:block}
.sb{position:relative;z-index:2;background:#000;border:4px solid #fff;border-radius:14px;padding:8px 14px;display:flex;gap:16px;align-items:flex-start;color:#fff}
.sbc{display:flex;flex-direction:column;align-items:center;gap:3px}
.sbl{font:700 .85rem/1 "Barlow Condensed",sans-serif;letter-spacing:.06em}
.sbn{font:700 1.8rem/1.1 Orbitron,"Courier New",monospace;color:#ff3030;background:#1b0000;border-radius:4px;padding:2px 8px;min-width:68px;text-align:center;text-shadow:0 0 8px rgba(255,48,48,.65)}
.sbs{font:600 .62rem/1 "Barlow Condensed",sans-serif;letter-spacing:.06em}
.gp{position:relative;z-index:1;width:min(460px,100%);background:#0b2242;border-radius:34px;padding:22px;display:flex;flex-direction:column;gap:10px}
.qbox{background:#fff;color:#0b2242;border-radius:12px;padding:14px 16px;min-height:64px;font-weight:600;font-size:1.2rem;line-height:1.3;margin-bottom:4px}
.grp{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;font:1.05rem/1.25 "Barlow",sans-serif;color:#0b2242;background:#fff;border:4px solid #fff;border-radius:10px;padding:8px 12px;min-height:48px}
.opt:hover:not(:disabled){border-color:#9fd2ff}
.opt:disabled{cursor:default}
.opt.sel{border-color:#2aa3ff}
.opt.ok{background:#1f9d55;border-color:#1f9d55;color:#fff}
.opt.bad{background:#d93025;border-color:#d93025;color:#fff}
.opt.reveal{background:transparent;border-color:#fff;color:#fff;font-weight:600;justify-content:center;text-align:center}
.opt.reveal:disabled{opacity:.45}
.fb{margin:2px 2px 0;color:#fff;font-weight:600}
.final{display:flex;justify-content:space-around;color:#fff;font:700 1.8rem "Barlow Condensed",sans-serif}
.clab{margin:6px 0 0;color:#fff;font-weight:600;text-align:center}
.crow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 .95rem/1.15 "Barlow",sans-serif;color:#0b2242;background:#bfe3ff;border:3px solid #fff;border-radius:10px;padding:8px 4px;min-height:56px;text-align:center}
.cbtn:hover:not(:disabled){background:#9fd2ff}
.cbtn.sel{background:#2aa3ff}
.cbtn:disabled{cursor:default}
.fb strong{font-size:1.2rem}
@media (min-width:760px){.sb{position:absolute;top:-22px;left:-26px}}
@media (max-width:720px){
 .top{grid-template-columns:minmax(96px,34%) 1fr;gap:14px}
 .tbtn{padding:10px 10px;font-size:1rem}
 .game{min-height:0;padding:16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
/* ===== CONTENT =====
   Replace the placeholder topics, terms and definitions here. */
const TOPICS = [1,2,3,4,5].map(i => ({
  name: "Topic " + i,
  terms: [1,2,3].map(n => ({term: "Topic " + i + " term " + n, def: "Definition goes here."}))
}));


const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = (s, i) => "topic-" + (i + 1);

document.getElementById("topicBtns").innerHTML =
  TOPICS.map((t, i) => `<a class="tbtn" href="#topic-${i + 1}">${esc(t.name)}</a>`).join("") +
  `<button class="tbtn all" data-i="all">All topics</button>`;
document.addEventListener("click", e => {
  const a = e.target.closest("a.tbtn");
  if(!a) return;
  e.preventDefault();
  const el = document.getElementById(a.getAttribute("href").slice(1));
  if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
});

document.getElementById("sections").innerHTML = TOPICS.map((t, i) => `
  <section class="topic" id="${slug(t, i)}">
    <div class="thead">${esc(t.name)}</div>
    <ul class="terms">${t.terms.map(x => `<li>${esc(x.term)}</li>`).join("")}</ul>
    <button class="fcbtn" data-i="${i}">Study ${esc(t.name)} flash cards</button>
  </section>`).join("");

/* Flash cards */
const dlg = document.getElementById("dlg"), card = document.getElementById("card");
let deck = [], pos = 0, flipped = false;
function draw(){
  const c = deck[pos];
  card.classList.toggle("back", flipped);
  card.textContent = c ? (flipped ? c.def : c.term) : "No cards yet.";
  document.getElementById("meta").textContent = c ? `Card ${pos + 1} of ${deck.length}. ${flipped ? "Showing definition." : "Tap the card to see the definition."}` : "";
}
function openDeck(which){
  if(which === "all"){ deck = TOPICS.flatMap(t => t.terms); document.getElementById("dttl").textContent = "All topics"; }
  else { const t = TOPICS[+which]; deck = t.terms.slice(); document.getElementById("dttl").textContent = t.name; }
  pos = 0; flipped = false; draw();
  if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-i]");
  if(b) openDeck(b.dataset.i);
});
card.onclick = () => { flipped = !flipped; draw(); };
document.getElementById("next").onclick = () => { if(deck.length){ pos = (pos + 1) % deck.length; flipped = false; draw(); } };
document.getElementById("prev").onclick = () => { if(deck.length){ pos = (pos - 1 + deck.length) % deck.length; flipped = false; draw(); } };
document.getElementById("shuf").onclick = () => {
  for(let i = deck.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  pos = 0; flipped = false; draw();
};
document.getElementById("close").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if(e.target === dlg) dlg.close(); });

/* ===== STUDY GAME QUESTIONS =====
   q = question, a = the right answer, w = the wrong answers (1 to 3).
   Answers are shuffled each time. Add as many questions as you like. */
const QUESTIONS = [
  {q:"{Insert Question 1}", a:"Answer A", w:["Answer B","Answer C","Answer D"]},
  {q:"{Insert Question 2}", a:"Answer B", w:["Answer A","Answer C","Answer D"]},
  {q:"{Insert Question 3}", a:"Answer C", w:["Answer A","Answer B","Answer D"]},
  {q:"{Insert Question 4}", a:"Answer D", w:["Answer A","Answer B","Answer C"]},
  {q:"{Insert Question 5}", a:"Answer A", w:["Answer B","Answer C","Answer D"]}
];
const CONF = [{k:"Confident", p:3}, {k:"Pretty sure", p:2}, {k:"Guessing", p:1}];
const PHRASES = {
  c3: ["From downtown!", "Swish!", "And one!", "Green!", "Splash!", "Gimme Three!"],
  c2: ["Midrange!", "Bucket!", "Slam Dunk!", "Layup!", "Posterized!"],
  c1: ["Free throw", "Lucky shot", "Fouled"],
  miss: ["Blocked!", "Airball", "Stolen", "Traveling", "Brick", "Stuffed!", "Rejected!", "Swatted!"]
};
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const shuffleArr = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let G;
function setQ(){
  const q = G.set[G.i];
  G.opts = shuffleArr([q.a].concat(q.w)); G.ci = G.opts.indexOf(q.a);
  G.sel = null; G.conf = null; G.rev = false; G.msg = "";
}
function newGame(){ G = {stage:"pick", i:0, home:0, vis:0, done:false, set:[]}; }
function gRender(){
  const panel = document.getElementById("panel"), total = G.set.length;
  const last = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  document.getElementById("homeScore").textContent = String(G.home).padStart(2, "0");
  document.getElementById("visScore").textContent = String(G.vis).padStart(2, "0");
  document.getElementById("qFrac").textContent = G.stage === "pick" ? "--" : (G.done ? total : G.i + 1) + "/" + total;
  if(G.stage === "pick"){
    const n = QUESTIONS.length;
    panel.innerHTML = `<div class="qbox" tabindex="-1">How many terms do you want to study?</div><div class="grp" role="group" aria-label="Number of terms">` +
      [["n10", "10"], ["n20", "20"], ["n38", "38"], ["nall", "All"]].map(([k, l]) => `<button class="opt" data-k="${k}">${l}</button>`).join("") +
      `</div><p class="fb">${n} available. Picking more than that gives you all of them.</p>`;
    return;
  }
  if(G.done){
    panel.innerHTML = `<div class="qbox" tabindex="-1">${total ? "Final score" : "No questions yet"}</div><div class="final"><span>Home ${G.home}</span><span>Visitor ${G.vis}</span></div><button class="opt reveal" data-k="again">Play again</button><button class="opt reveal" data-k="back">Back to topics</button>`;
    return;
  }
  const q = G.set[G.i];
  let h = `<div class="qbox" tabindex="-1">${esc(q.q)}</div><div class="grp" role="group" aria-label="Answers">`;
  G.opts.forEach((o, k) => {
    let c = "opt";
    if(G.rev){ if(k === G.ci) c += " ok"; else if(k === G.sel) c += " bad"; } else if(k === G.sel) c += " sel";
    h += `<button class="${c}" data-k="a${k}" ${G.rev ? "disabled" : ""}>${esc(o)}</button>`;
  });
  h += `</div>`;
  if(G.sel !== null){
    h += `<p class="clab">How confident are you?</p><div class="crow" role="group" aria-label="How confident are you?">`;
    CONF.forEach((c, k) => { h += `<button class="cbtn${G.conf === k ? " sel" : ""}" data-k="c${k}" ${G.rev ? "disabled" : ""}><span>${c.k}</span><span>+${c.p}</span></button>`; });
    h += `</div>`;
    if(G.rev) h += `<p class="fb" role="status">${G.msg}</p>`;
    h += `<button class="opt reveal" data-k="go" ${G.conf === null ? "disabled" : ""}>${G.rev ? (G.i + 1 < total ? "Next question" : "See results") : "Show answer"}</button>`;
  }
  panel.innerHTML = h;
  const el = last && panel.querySelector(`[data-k="${last}"]`);
  if(el && !el.disabled) el.focus();
}
document.getElementById("panel").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");
  if(!b || b.disabled) return;
  const k = b.dataset.k;
  let m, fresh = false;
  if((m = k.match(/^n(\d+|all)$/))){
    const n = m[1] === "all" ? QUESTIONS.length : Math.min(+m[1], QUESTIONS.length);
    G.set = shuffleArr(QUESTIONS).slice(0, n); G.i = 0; G.stage = "play";
    if(G.set.length) setQ(); else G.done = true;
    fresh = true;
  } else if((m = k.match(/^a(\d+)$/))){ if(!G.rev) G.sel = +m[1]; }
  else if((m = k.match(/^c(\d+)$/))){ if(!G.rev) G.conf = +m[1]; }
  else if(k === "go"){
    if(!G.rev){
      const pts = CONF[G.conf].p, right = G.sel === G.ci;
      if(right) G.home += pts; else G.vis += pts;
      G.rev = true;
      G.msg = `<strong>${pickOne(right ? PHRASES["c" + pts] : PHRASES.miss)}</strong> +${pts} for ${right ? "Home" : "Visitor"}`;
    } else {
      G.i++; fresh = true;
      if(G.i >= G.set.length) G.done = true; else setQ();
    }
  } else if(k === "again"){ newGame(); fresh = true; }
  else if(k === "back"){ showView("home"); return; }
  gRender();
  if(fresh){ const qb = document.querySelector("#panel .qbox"); if(qb) qb.focus(); }
});
function showView(v){
  const g = v === "game";
  if(g === !document.getElementById("gameView").hidden) return;
  document.getElementById("homeView").hidden = g;
  document.getElementById("gameView").hidden = !g;
  if(g){ newGame(); gRender(); }
  try{ location.hash = g ? "game" : "home"; }catch(e){}
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href="#game"], a[href="#home"]');
  if(!a) return;
  e.preventDefault();
  showView(a.getAttribute("href").slice(1));
});
window.addEventListener("hashchange", () => showView(location.hash === "#game" ? "game" : "home"));
if(location.hash === "#game") showView("game");
</script>
